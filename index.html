<title>Europe Trip Companion</title>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#F5EFEC; --surface:#FFFFFF; --surface-alt:#FBF3EF; --border:#E3D3CC;
    --text:#2B1917; --text-muted:#7C5E56;
    --primary:#6E2A34; --primary-strong:#4E1D26; --primary-soft:#F1DEE0;
    --accent:#B5792E; --accent-soft:#F3E3C7;
    --trip:#A8511F; --trip-soft:#F5DFCB;
    --neutral-tag:#79695C; --neutral-soft:#EEE6DC;
    --flight:#6B3F5E; --flight-soft:#EEE0EA;
    --good:#4F7A45; --good-soft:#E3EDDC;
    --warn:#A83E23; --warn-soft:#F5DFD2;
    --shadow: 0 1px 2px rgba(43,25,23,.07), 0 6px 16px rgba(43,25,23,.08);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1210; --surface:#291C19; --surface-alt:#332420; --border:#4A362F;
      --text:#F3E6DF; --text-muted:#C4A99D;
      --primary:#E0919E; --primary-strong:#F0AFB8; --primary-soft:#3D2229;
      --accent:#E3B15E; --accent-soft:#3D2E14;
      --trip:#E28C4C; --trip-soft:#3A2414;
      --neutral-tag:#BBAA9D; --neutral-soft:#332822;
      --flight:#CC9FC2; --flight-soft:#2E2130;
      --good:#8FC084; --good-soft:#1E2E1A;
      --warn:#E38C5E; --warn-soft:#3A2412;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1210; --surface:#291C19; --surface-alt:#332420; --border:#4A362F;
    --text:#F3E6DF; --text-muted:#C4A99D;
    --primary:#E0919E; --primary-strong:#F0AFB8; --primary-soft:#3D2229;
    --accent:#E3B15E; --accent-soft:#3D2E14;
    --trip:#E28C4C; --trip-soft:#3A2414;
    --neutral-tag:#BBAA9D; --neutral-soft:#332822;
    --flight:#CC9FC2; --flight-soft:#2E2130;
    --good:#8FC084; --good-soft:#1E2E1A;
    --warn:#E38C5E; --warn-soft:#3A2412;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    display:flex; flex-direction:column; overflow:hidden;
  }

  .topbar{
    flex:0 0 auto; background:var(--primary); color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    box-shadow:var(--shadow); position:relative; z-index:2;
  }
  .topbar h1{
    font-family:var(--font-display); font-weight:700; font-size:1.35rem;
    margin:0 0 2px; letter-spacing:.2px; text-wrap:balance;
  }
  .topbar .sub{font-size:.78rem; opacity:.85; font-family:var(--font-mono); letter-spacing:.02em;}

  .pillrow{
    flex:0 0 auto; display:flex; gap:8px; overflow-x:auto; padding:10px 14px;
    background:var(--surface-alt); border-bottom:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
  }
  .pillrow::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto; font-size:.72rem; font-weight:600; color:var(--primary);
    background:var(--primary-soft); border:1px solid var(--border);
    border-radius:999px; padding:5px 11px; white-space:nowrap;
    font-family:var(--font-mono); font-variant-numeric:tabular-nums;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pill:active{transform:scale(.96);}
  .pill:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  @keyframes pillJumpFlash{
    0%{box-shadow:0 0 0 3px var(--accent);}
    100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}
  }
  .day-card.jumped{animation:pillJumpFlash 1.1s ease-out;}

  main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .panel{padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 88px);}
  .panel[hidden]{display:none;}

  .section-label{
    font-family:var(--font-mono); font-size:.7rem; font-weight:600;
    text-transform:uppercase; letter-spacing:.09em; color:var(--text-muted);
    margin:4px 2px 10px;
  }

  /* ---- Itinerary cards ---- */
  .day-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:14px 15px; margin-bottom:12px;
  }
  .day-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .day-head-left{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .day-num{
    font-family:var(--font-mono); font-size:.68rem; font-weight:600; color:var(--text-muted);
    letter-spacing:.06em;
  }
  .day-date{font-family:var(--font-mono); font-size:.78rem; font-weight:600; color:var(--text);}
  .tag{
    font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 9px; border-radius:999px; white-space:nowrap; flex:0 0 auto;
  }
  .tag.flight{background:var(--flight-soft); color:var(--flight);}
  .tag.oktoberfest{background:var(--accent-soft); color:var(--accent);}
  .tag.daytrip{background:var(--trip-soft); color:var(--trip);}
  .tag.travel{background:var(--neutral-soft); color:var(--neutral-tag);}
  .tag.stay{background:var(--primary-soft); color:var(--primary);}

  .day-city{font-family:var(--font-mono); font-size:.72rem; color:var(--text-muted); margin-bottom:2px;}
  .day-title{font-family:var(--font-display); font-weight:600; font-size:1.05rem; margin:0 0 8px; text-wrap:balance;}
  .day-body ul{margin:0; padding-left:1.1em; display:flex; flex-direction:column; gap:6px;}
  .day-body li{font-size:.9rem; line-height:1.45;}
  .day-body li strong{color:var(--text);}
  .note{
    margin-top:10px; padding:9px 11px; background:var(--surface-alt);
    border-left:3px solid var(--accent); border-radius:6px;
    font-size:.82rem; color:var(--text-muted); line-height:1.5;
  }

  .milestone{
    display:flex; align-items:center; gap:12px; background:var(--surface-alt);
    border:1px dashed var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .milestone .m-date{font-family:var(--font-mono); font-size:.72rem; font-weight:600; color:var(--text-muted); flex:0 0 auto; width:96px;}
  .milestone .m-text{font-size:.88rem; font-weight:500;}

  /* ---- Countdown ---- */
  .countdown-card{
    background:linear-gradient(135deg, var(--primary), var(--primary-strong));
    color:#fff; border-radius:16px; padding:18px 18px 16px; margin-bottom:14px;
    text-align:center; box-shadow:var(--shadow);
  }
  .countdown-num{
    font-family:var(--font-display); font-weight:700; font-size:2.7rem; line-height:1;
    font-variant-numeric:tabular-nums; text-wrap:balance;
  }
  .countdown-label{font-size:.86rem; font-weight:600; opacity:.95; margin-top:4px;}
  .countdown-sub{font-family:var(--font-mono); font-size:.7rem; opacity:.78; margin-top:6px; letter-spacing:.02em;}

  /* ---- Checklist ---- */
  .checklist-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:14px 15px; margin-bottom:14px;
  }
  .checklist-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px;}
  .checklist-title{font-family:var(--font-display); font-weight:600; font-size:1.02rem;}
  .checklist-progress{font-family:var(--font-mono); font-size:.72rem; color:var(--text-muted); font-variant-numeric:tabular-nums; flex:0 0 auto;}
  .check-item{
    display:flex; align-items:flex-start; gap:10px; padding:9px 0;
    border-top:1px solid var(--border);
  }
  .check-item:first-of-type{border-top:none; padding-top:6px;}
  .check-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:20px; height:20px; flex:0 0 auto;
    border:2px solid var(--border); border-radius:6px; margin-top:1px; cursor:pointer;
    display:grid; place-content:center; background:var(--surface);
  }
  .check-item input[type="checkbox"]:checked{background:var(--good); border-color:var(--good);}
  .check-item input[type="checkbox"]:checked::after{content:"✓"; color:#fff; font-size:13px; font-weight:700; line-height:1;}
  .check-item input[type="checkbox"]:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  .check-item label{font-size:.9rem; line-height:1.4; cursor:pointer;}
  .check-item.done label{color:var(--text-muted); text-decoration:line-through;}

  /* ---- Hotels ---- */
  .hotel-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:14px 15px; margin-bottom:12px;
    display:flex; flex-direction:column; gap:6px;
  }
  .hotel-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .hotel-city{font-family:var(--font-display); font-weight:600; font-size:1.05rem;}
  .hotel-dates{font-family:var(--font-mono); font-size:.74rem; color:var(--text-muted); margin-top:1px;}
  .hotel-name{font-size:.92rem; font-weight:600; color:var(--primary);}
  .hotel-addr{font-size:.82rem; color:var(--text-muted); line-height:1.4;}
  .badge{
    font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 9px; border-radius:999px; flex:0 0 auto; white-space:nowrap;
  }
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.neutral{background:var(--neutral-soft); color:var(--neutral-tag);}

  /* ---- Trains ---- */
  .leg-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:13px 15px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px;
  }
  .leg-icon{
    flex:0 0 auto; width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:1.15rem;
    background:var(--primary-soft);
  }
  .leg-icon.air{background:var(--flight-soft);}
  .leg-main{flex:1 1 auto; min-width:0;}
  .leg-route{font-weight:600; font-size:.92rem; margin-bottom:2px; text-wrap:balance;}
  .leg-meta{font-size:.78rem; color:var(--text-muted); line-height:1.4;}
  .leg-dur{
    flex:0 0 auto; font-family:var(--font-mono); font-weight:600; font-size:.82rem;
    color:var(--primary); font-variant-numeric:tabular-nums; text-align:right;
  }

  /* ---- Activities ---- */
  .act-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:14px 15px; margin-bottom:12px;
  }
  .act-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .act-date{font-family:var(--font-mono); font-size:.72rem; font-weight:600; color:var(--text-muted);}
  .act-title{font-family:var(--font-display); font-weight:600; font-size:1rem; margin:2px 0 6px;}
  .act-desc{font-size:.88rem; line-height:1.5; color:var(--text);}
  .act-desc .price{font-family:var(--font-mono); font-weight:600; color:var(--primary);}

  /* ---- Tab bar ---- */
  nav.tabbar{
    flex:0 0 auto; position:relative; z-index:3;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
    box-shadow:0 -2px 10px rgba(22,35,46,.06);
  }
  nav.tabbar button{
    flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:6px 2px; font-family:var(--font-body);
    color:var(--text-muted); cursor:pointer; border-radius:10px;
  }
  nav.tabbar button .ic{font-size:1.25rem; line-height:1;}
  nav.tabbar button .lb{font-size:.6rem; font-weight:600; letter-spacing:0; white-space:nowrap;}
  nav.tabbar button[aria-selected="true"]{color:var(--primary);}
  nav.tabbar button[aria-selected="true"] .ic{transform:translateY(-1px);}
  nav.tabbar button:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

  @media (prefers-reduced-motion:no-preference){
    .day-card, .hotel-card, .leg-card, .act-card{transition:transform .15s ease;}
  }
</style>

    { mode:"train", route:"Brussels → Amsterdam", dur:"~1h50", meta:"Eurostar/Thalys, direct high-speed" },
    { mode:"train", route:"Amsterdam → Frankfurt Airport", dur:"~3h38m", meta:"Book straight to the Fernbahnhof, not Hbf" },
    { mode:"air", route:"Frankfurt → Hyderabad", dur:"—", meta:"1:00pm departure, Oct 11" },
    { mode:"air", route:"Hyderabad → Austin", dur:"—", meta:"Oct 29 — the trip home" }
  ];

  var ACTIVITIES = [
    { date:"Oct 2", title:"Oktoberfest tent table reservation", status:"Optional", badge:"neutral",
      desc:"Not required to get in, but worth it for guaranteed seating at peak hours." },
    { date:"Oct 3", title:"Salzburg sightseeing", status:"No booking needed", badge:"good",
      desc:"Self-guided — Altstadt, fortress, St. Peter's Abbey, Augustiner Bräustübl." },
    { date:"Oct 5", title:"Belgian Chocolate Making Workshop", status:"To book", badge:"warn",
      desc:"2:00–4:30pm · Voldersstraat 30, Brussels · 2.5 hrs · <span class=\"price\">~$69/person</span> · hot chocolate + a box of your own chocolates included. Book via belgianchocolateworkshop.com or GetYourGuide/Viator." },
    { date:"Oct 9", title:"Anne Frank House", status:"Booked", badge:"good",
      desc:"Introductory program (English) · 7:45pm entry, Entrance 2 · 2 adult tickets · <span class=\"price\">€23.50/adult</span> · tickets are on your phone as a QR code — no printing needed. Arrive 5 minutes early; no large bags or trolleys." }
  ];

  var TASKS = [
    { id:"t1", text:"Download the train app for Germany (DB Navigator)" },
    { id:"t2", text:"Download the train app for Belgium & Amsterdam (SNCB / NS)" },
    { id:"t3", text:"Book train tickets: Brussels → Amsterdam" },
    { id:"t4", text:"Book train tickets: Amsterdam → Frankfurt" },
    { id:"t5", text:"Buy tickets: Belgian chocolate-making class" },
    { id:"t6", text:"Brussels — castle tickets" },
    { id:"t7", text:"Book Luxembourg hotel" },
    { id:"t8", text:"Book Brussels hotel" }
  ];

  var activateTab; // assigned by setupTabs, called from pill clicks

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function shortDate(d){
    var parts = d.split(', ');
    return parts.length > 1 ? parts[1] : d;
  }

  function scrollToDay(dayNum){
    if(typeof activateTab === 'function') activateTab('itinerary');
    var target = document.getElementById('day-card-' + dayNum);
    if(!target) return;
    window.requestAnimationFrame(function(){
      target.scrollIntoView({ block: 'start', behavior: 'smooth' });
      target.classList.remove('jumped');
      void target.offsetWidth; // restart animation if clicked twice
      target.classList.add('jumped');
      window.setTimeout(function(){ target.classList.remove('jumped'); }, 1200);
    });
  }

  function renderPills(){
    var row = document.getElementById('pillrow');
    DAYS.forEach(function(d){
      var btn = el('button','pill', shortDate(d.date));
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Jump to Day ' + d.day + ', ' + d.date);
      btn.addEventListener('click', function(){ scrollToDay(d.day); });
      row.appendChild(btn);
    });
  }

  function renderCountdown(){
    var p = document.getElementById('panel-home');
    var card = el('div','countdown-card');
    function localDate(y,m,day){ return new Date(y, m-1, day); }
    var now = new Date();
    var today = localDate(now.getFullYear(), now.getMonth()+1, now.getDate());
    var tripStart = localDate(2026,10,1);
    var europeEnd = localDate(2026,10,11);
    var homeDate = localDate(2026,10,29);
    var msPerDay = 86400000;
    var num, label, sub;
    if(today < tripStart){
      var days = Math.round((tripStart - today) / msPerDay);
      num = days;
      label = (days === 1 ? 'day' : 'days') + ' to go';
      sub = 'until Frankfurt · Oct 1, 2026';
    } else if(today <= europeEnd){
      var dayIdx = Math.round((today - tripStart) / msPerDay) + 1;
      var match = DAYS.filter(function(dd){ return dd.day === dayIdx; })[0];
      num = dayIdx;
      label = 'Day ' + dayIdx + ' of 11';
      sub = match ? match.city : 'On the Europe leg';
    } else if(today < homeDate){
      var days2 = Math.round((homeDate - today) / msPerDay);
      num = days2;
      label = (days2 === 1 ? 'day' : 'days') + ' until Austin';
      sub = 'Currently in Hyderabad';
    } else {
      num = '✈️';
      label = 'Welcome home';
      sub = 'Trip complete';
    }
    card.innerHTML =
      '<div class="countdown-num">' + num + '</div>' +
      '<div class="countdown-label">' + label + '</div>' +
      '<div class="countdown-sub">' + sub + '</div>';
    p.appendChild(card);
  }

  function loadTaskState(){
    try{
      var raw = localStorage.getItem('europeTripTasks');
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveTaskState(state){
    try{ localStorage.setItem('europeTripTasks', JSON.stringify(state)); }catch(e){}
  }

  function renderChecklist(){
    var p = document.getElementById('panel-home');
    var state = loadTaskState();
    var card = el('div','checklist-card');
    var head = el('div','checklist-head');
    head.appendChild(el('div','checklist-title','Still to book'));
    var progress = el('div','checklist-progress');
    head.appendChild(progress);
    card.appendChild(head);
    var list = el('div','check-list');
    function updateProgress(){
      var done = TASKS.filter(function(t){ return !!state[t.id]; }).length;
      progress.textContent = done + ' of ' + TASKS.length + ' done';
    }
    TASKS.forEach(function(t){
      var row = el('div','check-item' + (state[t.id] ? ' done' : ''));
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'chk-' + t.id;
      cb.checked = !!state[t.id];
      var lbl = document.createElement('label');
      lbl.setAttribute('for', cb.id);
      lbl.textContent = t.text;
      cb.addEventListener('change', function(){
        state[t.id] = cb.checked;
        row.classList.toggle('done', cb.checked);
        saveTaskState(state);
        updateProgress();
      });
      row.appendChild(cb);
      row.appendChild(lbl);
      list.appendChild(row);
    });
    card.appendChild(list);
    updateProgress();
    p.appendChild(card);
  }

  function renderItinerary(){
    var p = document.getElementById('panel-itinerary');
    p.appendChild(el('div','section-label','Day by day'));
    DAYS.forEach(function(d){
      var card = el('div','day-card');
      card.id = 'day-card-' + d.day;
      var head = el('div','day-head');
      var left = el('div','day-head-left',
        '<span class="day-num">DAY '+d.day+'</span><span class="day-date">'+d.date+'</span>');
      head.appendChild(left);
      head.appendChild(el('span','tag '+d.tag, d.tagLabel));
      card.appendChild(head);
      card.appendChild(el('div','day-city', d.city));
      card.appendChild(el('p','day-title', d.title));
      var body = el('div','day-body');
      var ul = el('ul');
      d.bullets.forEach(function(b){ ul.appendChild(el('li',null,b)); });
      body.appendChild(ul);
      card.appendChild(body);
      if(d.note) card.appendChild(el('div','note', d.note));
      p.appendChild(card);
    });
    p.appendChild(el('div','section-label','Onward'));
    MILESTONES.forEach(function(m){
      var row = el('div','milestone');
      row.appendChild(el('div','m-date', m.date));
      row.appendChild(el('div','m-text', m.text));
      p.appendChild(row);
    });
  }

  function renderHotels(){
    var p = document.getElementById('panel-hotels');
    p.appendChild(el('div','section-label','All five nights, booked'));
    HOTELS.forEach(function(h){
      var card = el('div','hotel-card');
      var top = el('div','hotel-top');
      var left = el('div',null,
        '<div class="hotel-city">'+h.city+'</div><div class="hotel-dates">'+h.dates+'</div>');
      top.appendChild(left);
      top.appendChild(el('span','badge '+h.badge, h.status));
      card.appendChild(top);
      card.appendChild(el('div','hotel-name', h.name));
      card.appendChild(el('div','hotel-addr', h.addr));
      p.appendChild(card);
    });
  }

  function renderTrains(){
    var p = document.getElementById('panel-trains');
    p.appendChild(el('div','section-label','Getting between cities'));
    LEGS.forEach(function(l){
      var card = el('div','leg-card');
      var icon = el('div','leg-icon'+(l.mode==='air' ? ' air' : ''), l.mode==='air' ? '✈️' : '🚆');
      card.appendChild(icon);
      var main = el('div','leg-main',
        '<div class="leg-route">'+l.route+'</div><div class="leg-meta">'+l.meta+'</div>');
      card.appendChild(main);
      card.appendChild(el('div','leg-dur', l.dur));
      p.appendChild(card);
    });
  }

  function renderActivities(){
    var p = document.getElementById('panel-activities');
    p.appendChild(el('div','section-label','Booked & to-book'));
    ACTIVITIES.forEach(function(a){
      var card = el('div','act-card');
      var top = el('div','act-top');
      top.appendChild(el('div','act-date', a.date));
      top.appendChild(el('span','badge '+a.badge, a.status));
      card.appendChild(top);
      card.appendChild(el('p','act-title', a.title));
      card.appendChild(el('div','act-desc', a.desc));
      p.appendChild(card);
    });
  }

  function setupTabs(){
    var buttons = document.querySelectorAll('#tabbar button');
    var panels = {
      home: document.getElementById('panel-home'),
      itinerary: document.getElementById('panel-itinerary'),
      hotels: document.getElementById('panel-hotels'),
      trains: document.getElementById('panel-trains'),
      activities: document.getElementById('panel-activities')
    };
    function activate(name, keepScroll){
      Object.keys(panels).forEach(function(k){ panels[k].hidden = (k !== name); });
      buttons.forEach(function(b){
        b.setAttribute('aria-selected', b.getAttribute('data-tab') === name ? 'true' : 'false');
      });
      try{ localStorage.setItem('europeTripTab', name); }catch(e){}
      if(!keepScroll) document.querySelector('main').scrollTop = 0;
    }
    buttons.forEach(function(b){
      b.addEventListener('click', function(){ activate(b.getAttribute('data-tab')); });
    });
    var last = 'home';
    try{ last = localStorage.getItem('europeTripTab') || 'home'; }catch(e){}
    activate(last);
    activateTab = function(name){ activate(name, true); };
  }

  renderPills();
  renderCountdown();
  renderChecklist();
  renderItinerary();
  renderHotels();
  renderTrains();
  renderActivities();
  setupTabs();
})();
</script>
